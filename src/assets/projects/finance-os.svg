<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- bar chart -->
  <rect x="520" y="200" width="60" height="90" rx="8" fill="#ffffff" opacity="0.22"/>
  <rect x="600" y="170" width="60" height="120" rx="8" fill="#ffffff" opacity="0.30"/>
  <rect x="680" y="130" width="60" height="160" rx="8" fill="#ffffff" opacity="0.38"/>
  <!-- trend line -->
  <polyline points="80,270 220,240 340,255 460,180 600,150" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="600" cy="150" r="10" fill="#ffffff"/>
  <!-- coin -->
  <circle cx="150" cy="200" r="70" fill="#ffffff" opacity="0.16"/>
  <circle cx="150" cy="200" r="52" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9">$</text>
</svg>
