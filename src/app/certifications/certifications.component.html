<div class="px-6 md:px-12 lg:px-16 flex flex-col items-center gap-10 mt-16 mb-16 w-full">
    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100">Certifications</h2>
    <div class="flex flex-wrap justify-center gap-8 w-full max-w-7xl">
        @for (certificate of certificates; track certificate.title) {
            <div class="group flex flex-col bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 border border-slate-100 dark:border-slate-700 w-full md:w-[calc(50%-1rem)] lg:w-[calc(33.333%-1.5rem)] max-w-md">
                <!-- Abstract Top Banner -->
                <div class="h-32 bg-gradient-to-r from-yellow-500 to-orange-500 relative overflow-hidden flex justify-center items-center">
                    <div class="absolute inset-0 bg-white/20 dark:bg-black/20 mix-blend-overlay"></div>
                    <i class="fa-solid fa-certificate absolute -bottom-4 -right-4 text-8xl text-white/20 group-hover:scale-110 transition-transform duration-500"></i>
                    <!-- Subtle badge icon in the center -->
                    <div class="z-10 w-16 h-16 bg-white/30 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg border border-white/50">
                        <i class="fa-solid fa-award text-3xl text-white"></i>
                    </div>
                </div>
                
                <!-- Content -->
                <div class="flex flex-col grow p-6 text-center">
                    <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">{{ certificate.title }}</h3>
                    <p class="text-slate-500 dark:text-slate-400 font-medium mb-1">{{ certificate.organization }}</p>
                    <p class="text-slate-400 dark:text-slate-500 text-sm mb-6 grow">{{ certificate.time }}</p>
                    
                    <a [href]="certificate.link" target="_blank" rel="noopener noreferrer" class="mt-auto inline-flex items-center justify-center gap-2 w-full py-3 px-4 bg-orange-500 hover:bg-orange-600 dark:bg-orange-600 dark:hover:bg-orange-700 text-white font-medium rounded-xl transition-colors">
                        View Certificate
                        <i class="fa-solid fa-arrow-up-right-from-square text-sm ml-1"></i>
                    </a>
                </div>
            </div>
        }
    </div>
</div>
