<div class="flex flex-col items-center justify-center gap-7">
    <span class="text-3xl font-bold">Certifications</span>
    <div class="flex flex-wrap gap-7 justify-center">
        @for (certificate of certificates; track certificate.title) {
            <p-card
                [header]="certificate.title"
                [subheader]="certificate.organization"
                class="border border-zinc-400 drop-shadow-xl/20 text-center min-w-100 max-w-100"
            >
                <p>{{ certificate.time }}</p>
                <ng-template pTemplate="footer">
                    <a
                        [href]="certificate.link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <p-button label="View Certificate"></p-button>
                    </a>
                </ng-template>
            </p-card>
        }
    </div>
</div>
