<div class="home-section-box container">
    <h1>What I do</h1>
    <div id="whatIDoMainBox" class="container">
        @for (item of whatIDoItems; track item.title) {
            <p-card class="shadow">
                <div class="what-i-do-card-content">
                    <i [class]="`${item.icon} fa-3x text-primary`"></i>
                    <h4>{{ item.title }}</h4>
                    <p class="card-text">{{ item.description }}</p>
                </div>
            </p-card>
        }
    </div>
</div>
