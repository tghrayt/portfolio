<div class="flex flex-col items-center justify-center gap-10 mt-16 w-full">
    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100">Education</h2>
    <div class="flex flex-col gap-8 w-full max-w-3xl px-4 md:px-0">
        @for (item of educationItems; track item.title) {
            <div class="group bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 border border-slate-100 dark:border-slate-700 flex flex-col items-center text-center">
                <div class="w-16 h-16 rounded-full bg-blue-50 dark:bg-slate-700 flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-100 dark:group-hover:bg-slate-600 transition-all duration-300">
                    <i class="fa-solid fa-graduation-cap fa-2x text-blue-600 dark:text-blue-400"></i>
                </div>
                <h3 class="text-xl font-bold mb-3 text-slate-800 dark:text-white">{{ item.title }}</h3>
                <span class="text-lg font-medium text-slate-600 dark:text-slate-300">{{ item.organization }}</span>
                <span class="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-2">{{ item.time }}</span>
            </div>
        }
    </div>
</div>
