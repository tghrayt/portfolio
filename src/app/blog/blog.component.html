<div class="px-16 flex flex-wrap gap-7 justify-center mt-7">
    @for (blog of blogs; track blog.title) {
        <p-card
            [header]="blog.title"
            [subheader]="blog.description"
            class="border border-zinc-400 drop-shadow-xl/20 text-center min-w-100 max-w-100"
        >
            <ng-template pTemplate="footer">
                <a [href]="blog.link" target="_blank" rel="noopener noreferrer">
                    <p-button
                        label="Read Article on"
                        icon="fa-brands fa-dev"
                        iconPos="right"
                    ></p-button>
                </a>
            </ng-template>
        </p-card>
    }
</div>
