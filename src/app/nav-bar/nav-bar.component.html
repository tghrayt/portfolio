<div
    class="w-full px-6 md:px-12 lg:px-16 py-4 border-b border-slate-200/50 dark:border-slate-800/50 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md grid grid-cols-3 content-center items-center transition-all"
>
    <a class="justify-self-start text-xl font-bold dark:text-white transition-colors" routerLink="/"
        >Dilanka Rathnasiri
    </a>

    <div class="justify-self-center flex gap-7">
        @for (item of menuItems; track item.label) {
            <a
                class="box-navbar-text dark:text-slate-300 dark:hover:text-white transition-colors"
                [routerLink]="item.link"
                routerLinkActive="active"
                aria-current="page"
                [routerLinkActiveOptions]="{ exact: item.exact }"
            >
                {{ item.label }}
            </a>
        }
    </div>

    <div class="justify-self-end flex items-center gap-4">
        <button (click)="toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors w-10 h-10 flex items-center justify-center cursor-pointer" aria-label="Toggle Dark Mode">
            <i [class]="isDarkMode ? 'fa-solid fa-sun text-yellow-400 text-lg' : 'fa-solid fa-moon text-slate-700 text-lg'"></i>
        </button>
        <app-social-media />
    </div>
</div>
