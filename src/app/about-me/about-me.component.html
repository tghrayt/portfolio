<div
    class="relative w-full rounded-[2.5rem] overflow-hidden p-8 md:p-16 lg:p-20 shadow-2xl bg-white dark:bg-slate-900 transition-colors duration-500 grid md:grid-cols-2 gap-8 items-center border border-slate-100 dark:border-slate-800"
>
    <!-- Text Content -->
    <div
        class="relative z-10 flex flex-col justify-center items-start text-left max-w-2xl gap-6 order-2 md:order-1"
    >
        <h1
            class="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary"
        >
            Youssef Ait Tghrayt
        </h1>
        <div
            class="text-2xl md:text-3xl font-semibold text-slate-700 dark:text-slate-300 flex items-center"
        >
            <span>{{ currentTitle }}</span
            ><span class="cursor"></span>
        </div>
        <p
            class="text-lg md:text-xl font-medium text-slate-600 dark:text-slate-400 leading-relaxed mt-2"
        >
            {{ languageService.t('about.tagline') }}
        </p>
    </div>

    <!-- Profile Image -->
    <div class="relative z-10 flex justify-center order-1 md:order-2">
        <div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
        <img
            ngSrc="assets/youssef.jpg"
            class="relative z-10 border-4 border-white dark:border-slate-800 rounded-full shadow-2xl object-cover"
            alt="Youssef Ait Tghrayt"
            width="320"
            height="320"
            priority
        />
    </div>
</div>
