<div class="relative w-full rounded-[2.5rem] overflow-hidden p-10 md:p-16 lg:p-20 shadow-2xl bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-600 dark:from-slate-800 dark:via-indigo-950 dark:to-slate-900 transition-colors duration-500 flex flex-col md:flex-row items-center justify-center gap-12 md:gap-20">
    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 w-full h-full opacity-30 mix-blend-overlay pointer-events-none" style="background-image: radial-gradient(circle at top left, rgba(255,255,255,0.4) 0%, transparent 40%), radial-gradient(circle at bottom right, rgba(0,255,255,0.2) 0%, transparent 40%);"></div>

    <!-- Profile Image -->
    <div class="relative z-10 shrink-0">
        <div class="absolute inset-0 bg-white/30 dark:bg-black/30 blur-2xl rounded-full"></div>
        <img
            ngSrc="assets/dilanka.jpg"
            class="relative z-10 border-4 border-white/20 dark:border-white/10 rounded-full shadow-2xl object-cover"
            alt="Dilanka Rathnasiri"
            width="280"
            height="280"
            priority
        />
    </div>

    <!-- Text Content -->
    <div class="relative z-10 flex flex-col justify-center items-center md:items-start text-center md:text-left text-white max-w-2xl gap-5">
        <h1 class="text-4xl md:text-5xl lg:text-7xl font-extrabold tracking-tight drop-shadow-md">
            Dilanka Rathnasiri
        </h1>
        <div class="text-2xl md:text-3xl font-semibold text-blue-100 dark:text-indigo-200 h-10 flex items-center">
            <span>{{ currentTitle }}</span><span class="cursor"></span>
        </div>
        <p class="text-lg md:text-xl font-medium text-white/90 dark:text-white/80 leading-relaxed max-w-lg mt-2">
            Passionate backend engineer with a strong interest in cloud computing, system architecture, and DevOps.
        </p>
    </div>
</div>
