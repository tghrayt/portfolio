<div class="px-6 md:px-12 lg:px-16 flex flex-col items-center gap-10 mt-16 mb-16 w-full">
    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100">Projects</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full max-w-7xl">
        @for (project of projects; track project.title) {
            <div class="group relative flex flex-col bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-lg border border-slate-100 dark:border-slate-700">
                <!-- Abstract Top Banner -->
                <div class="h-40 bg-gradient-to-br from-primary to-secondary relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/10 dark:bg-black/20 mix-blend-overlay"></div>
                    <i class="fa-solid fa-code absolute -bottom-6 -right-6 text-[8rem] text-white/10 group-hover:scale-110 transition-transform duration-500"></i>
                </div>
                
                <!-- Content -->
                <div class="flex flex-col grow p-6">
                    <h3 class="text-2xl font-bold text-slate-800 dark:text-white mb-3 line-clamp-2">{{ project.title }}</h3>
                    <p class="text-slate-600 dark:text-slate-300 grow line-clamp-4">{{ project.description }}</p>
                </div>
                
                <!-- Hover Overlay -->
                <div class="absolute inset-0 bg-slate-900/80 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center gap-4 backdrop-blur-sm z-10">
                    <h3 class="text-2xl font-bold text-white mb-2 text-center px-4">{{ project.title }}</h3>
                    <a [href]="project.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 py-3 px-6 bg-primary hover:bg-primary-hover text-white font-medium rounded-xl transition-transform hover:scale-105 shadow-xl">
                        <i class="fa-brands fa-github text-xl"></i>
                        View Source
                    </a>
                </div>
            </div>
        }
    </div>
</div>
