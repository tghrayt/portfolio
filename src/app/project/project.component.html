<div class="px-16 flex flex-wrap gap-7 justify-center mt-7">
    @for (project of projects; track project.title) {
        <p-card
            [header]="project.title"
            [subheader]="project.description"
            class="border border-zinc-400 drop-shadow-xl/20 text-center min-w-100 max-w-100"
        >
            <ng-template pTemplate="footer">
                <a
                    [href]="project.link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <p-button
                        icon="fa-brands fa-github"
                        label="View on Github"
                    ></p-button>
                </a>
            </ng-template>
        </p-card>
    }
</div>
