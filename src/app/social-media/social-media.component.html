<div class="flex justify-end gap-6">
    @for (item of socialMediaItems; track item.label) {
        <a
            [href]="item.link"
            [class]="item.icon"
            class="text-2xl text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary-hover transition-colors"
            target="_blank"
            rel="noopener noreferrer"
        ></a>
    }
</div>
