<div class="home-section-box container">
    <h1>Skills</h1>
    <div id="skillsMainBox" class="container">
        @for (item of skillsItems; track item.name) {
            <p-card class="shadow text-bg-primary">
                <div class="skills-card-content">
                    <h6>{{ item.name }}</h6>
                </div>
            </p-card>
        }
    </div>
</div>
