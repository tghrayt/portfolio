<div class="flex flex-col items-center justify-center gap-10 mt-16 w-full">
    <h2
        class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100"
    >
        {{ languageService.t('section.skills') }}
    </h2>
    <div class="flex flex-col gap-12 w-full max-w-4xl px-4 md:px-0">
        @for (category of skillCategories; track category.category) {
            <div class="flex flex-col items-center gap-6">
                <h3
                    class="text-2xl font-bold text-slate-700 dark:text-slate-300"
                >
                    {{ category.category }}
                </h3>
                <div class="flex flex-wrap gap-4 justify-center">
                    @for (item of category.skills; track item.name) {
                        <div
                            class="px-5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full shadow-sm hover:shadow-md hover:border-primary dark:hover:border-primary-hover hover:-translate-y-1 transition-all duration-300 flex items-center gap-2 cursor-default"
                        >
                            @if (item.icon) {
                                <i [class]="item.icon + ' text-lg'"></i>
                            }
                            <span
                                class="font-semibold text-slate-700 dark:text-slate-200"
                                >{{ item.name }}</span
                            >
                        </div>
                    }
                </div>
            </div>
        }
    </div>
</div>
