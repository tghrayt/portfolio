<div class="flex flex-col items-center justify-center gap-10 mt-16 w-full">
    <h2
        class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100"
    >
        {{ languageService.t('section.experience') }}
    </h2>
    <div class="w-full max-w-4xl px-4 md:px-0">
        <ul
            class="relative border-l-2 border-slate-200 dark:border-slate-700 ml-4 md:ml-0 list-none p-0"
        >
            @for (item of experienceItems; track item.title) {
                <li class="mb-10 ml-8 relative">
                    <!-- Timeline Dot -->
                    <span
                        class="absolute -left-[41px] top-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-primary ring-4 ring-white dark:ring-slate-900"
                    ></span>

                    <!-- Content Card -->
                    <div
                        class="bg-white dark:bg-slate-800/80 rounded-2xl p-6 shadow-lg border border-slate-100 dark:border-slate-700 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col sm:flex-row sm:items-start gap-4"
                    >
                        @if (item.logo) {
                            <div
                                class="w-14 h-14 shrink-0 rounded-xl bg-white flex items-center justify-center p-2 border border-slate-100"
                            >
                                <img
                                    [src]="item.logo"
                                    [alt]="item.organization"
                                    class="max-w-full max-h-full object-contain"
                                />
                            </div>
                        }
                        <div>
                            <h3
                                class="flex items-center mb-1 text-xl font-bold text-slate-800 dark:text-white"
                            >
                                {{ item.title }}
                            </h3>
                            <div
                                class="text-lg font-medium text-slate-600 dark:text-slate-300 mb-2"
                            >
                                {{ item.organization }}
                            </div>
                            <time
                                class="block mb-4 text-sm font-semibold leading-none text-slate-500 dark:text-slate-400"
                                >{{ item.time }}</time
                            >
                        </div>
                    </div>
                </li>
            }
        </ul>
    </div>
</div>
