<div class="flex flex-col items-center justify-center gap-7">
    <span class="text-3xl font-bold">Experience</span>
    <div id="experienceMainBox" class="flex flex-wrap gap-7 justify-center">
        @for (item of experienceItems; track item.title) {
            <p-card
                class="border border-zinc-400 drop-shadow-xl/20 text-center min-w-100 max-w-100"
                [header]="item.title"
                [subheader]="item.organization"
            >
                <ng-template pTemplate="footer">
                    <h6>{{ item.time }}</h6>
                </ng-template>
            </p-card>
        }
    </div>
</div>
