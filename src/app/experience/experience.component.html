<div class="flex flex-col items-center justify-center gap-10 mt-16 w-full">
    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-slate-100">Experience</h2>
    <div class="w-full max-w-5xl px-4 md:px-0">
        <p-timeline [value]="experienceItems" align="alternate" styleClass="w-full">
            <ng-template pTemplate="content" let-item>
                <p-card [header]="item.title" [subheader]="item.organization" styleClass="mb-8 text-left shadow-lg border border-slate-100 dark:border-slate-700 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 dark:bg-slate-800/80 rounded-2xl overflow-hidden">
                    <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold mt-2">{{ item.time }}</p>
                </p-card>
            </ng-template>
        </p-timeline>
    </div>
</div>
